services:
  insight:
    build:
      context: .
    image: insight:0.1.0
    init: false
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - INSIGHT_OFFICIAL_IDENTIFIER_TYPE
      - INSIGHT_OFFICIAL_IDENTIFIER_ISSUER
      - INSIGHT_OFFICIAL_IDENTIFIER_PATTERN
      - INSIGHT_OFFICIAL_IDENTIFIER_NORMALIZATION
    volumes:
      - insight-data:/var/lib/insight
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

volumes:
  insight-data:
    external: true
    name: insight-data

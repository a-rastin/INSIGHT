name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insight_ci
          POSTGRES_PASSWORD: insight_ci
          POSTGRES_USER: insight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight_ci -d insight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://insight_ci:insight_ci@127.0.0.1:5432/insight_ci
      TEST_DATABASE_URL: postgresql://insight_ci:insight_ci@127.0.0.1:5432/insight_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Run full local-service pipeline
        run: npm run ci
      - name: Verify test artifacts are synthetic and secret-free
        if: always()
        run: node scripts/run-local-only.mjs npm run test:artifacts:scan
